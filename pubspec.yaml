name: dinero_pareja
description: App de dinero compartido para una pareja, preparada para Android e iPhone con Firebase.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  intl: ^0.19.0
  flutter_launcher_icons: ^0.14.4
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo_ia.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo_ia.png"
  adaptive_icon_background: null
  adaptive_icon_foreground: null