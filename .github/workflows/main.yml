name: Compilar iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar dependencias
        run: flutter pub get

      - name: Comprobar proyecto
        run: flutter analyze || true

      - name: Compilar iOS sin firma
        run: flutter build ios --release --no-codesign

      - name: Crear IPA sin firmar
        run: |
          set -e

          mkdir -p dist
          mkdir -p build/ios/iphoneos/Payload

          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/

          cd build/ios/iphoneos
          zip -r ../../../dist/dinero-pareja.ipa Payload

          cd ../../..
          echo "=== IPA GENERADO ==="
          ls -lh dist/dinero-pareja.ipa

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: dinero-pareja-ipa
          path: dist/dinero-pareja.ipa
          if-no-files-found: error
