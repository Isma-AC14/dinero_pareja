name: Compilar iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar dependencias
        run: flutter pub get

      - name: Comprobar proyecto
        run: flutter analyze || true

      - name: Compilar IPA
        run: flutter build ipa --release --no-codesign

      - name: Mostrar archivos generados
        run: |
          echo "=== ARCHIVE ==="
          find build/ios/archive -maxdepth 3 -type f | head -100
          echo "=== IOS BUILD ==="
          find build/ios -maxdepth 3 -type f | head -200

      - name: Guardar compilación iOS
        uses: actions/upload-artifact@v4
        with:
          name: dinero-pareja-ios
          path: build/ios/
